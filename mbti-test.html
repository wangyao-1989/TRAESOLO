        * {
            font-family: 'Noto Sans SC', 'Poppins', sans-serif;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); }
        }
        
        @keyframes slide-in-left {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes slide-in-right {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce-in {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        .gradient-bg {
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
        }
        
        .slide-in-left {
            animation: slide-in-left 0.6s ease-out forwards;
        }
        
        .slide-in-right {
            animation: slide-in-right 0.6s ease-out forwards;
        }
        
        .fade-up {
            animation: fade-up 0.5s ease-out forwards;
        }
        
        .bounce-in {
            animation: bounce-in 0.8s ease-out forwards;
        }
        
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .option-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        .option-btn.selected {
            transform: scale(1.02);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.3), 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .primary-btn {
            background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
            transition: all 0.3s ease;
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
        
        .progress-bar {
            transition: width 0.5s ease-out;
        }
        
        .mbti-letter {
            display: inline-block;
            animation: float 2s ease-in-out infinite;
        }
        
        .mbti-letter:nth-child(2) { animation-delay: 0.2s; }
        .mbti-letter:nth-child(3) { animation-delay: 0.4s; }
        .mbti-letter:nth-child(4) { animation-delay: 0.6s; }
        
        .strength-item::before, .weakness-item::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .strength-item::before {
            background: linear-gradient(135deg, #10B981, #34D399);
        }
        
        .weakness-item::before {
            background: linear-gradient(135deg, #F59E0B, #FBBF24);
        }
        
        .type-card {
            transition: all 0.3s ease;
        }
        
        .type-card:hover {
            transform: translateY(-5px);
        }

            },
            "ESFJ": {

                description: "极有同情心、爱交际、受欢迎的人，总是热心帮助别人。你喜欢社交，并总是确保每个人都开心。",
                strengths: ["忠诚度高", "敏感", "温暖热情", "善于连接", "实用主义"],

                careers: ["销售代表", "护士", "教师", "社会工作者", "活动策划"],

            },
            "ISTP": {
                name: "鉴赏家",
                description: "大胆而实际的实验家，擅长使用各种工具。你动手能力强，喜欢解决实际问题。",
                strengths: ["乐观积极", "创造力", "务实", "自发性", "理性分析"],
                weaknesses: ["固执", "不敏感", "私密", "容易无聊", "冒险行为"],
                careers: ["工程师", "机械师", "飞行员", "运动员", "法医"],
                color: "from-zinc-600 to-neutral-600",
                bgColor: "bg-gradient-to-br from-zinc-50 to-neutral-100"
            },
            "ISFP": {
                name: "探险家",
                description: "灵活有魅力的艺术家，随时准备探索和体验新事物。你温和敏感，热爱美与和谐。",
                strengths: ["有魅力", "敏感", "想象力", "热情", "好奇心"],
                weaknesses: ["过于独立", "不可预测", "容易紧张", "自尊心低", "难以规划"],
                careers: ["艺术家", "设计师", "厨师", "摄影师", "理疗师"],
                color: "from-teal-500 to-cyan-500",
                bgColor: "bg-gradient-to-br from-teal-50 to-cyan-50"
            },
            "ESTP": {
                name: "企业家",
                description: "聪明、精力充沛、善于感知的人，真正喜欢生活在危险边缘。你行动力强，喜欢刺激和挑战。",
                strengths: ["大胆", "理性", "原创", "直接", "善于社交"],
                weaknesses: ["不敏感", "不耐烦", "冒险", "不守承诺", "不善理论"],
                careers: ["企业家", "销售", "运动员", "紧急救援", "股票交易员"],
                color: "from-orange-500 to-red-500",
                bgColor: "bg-gradient-to-br from-orange-50 to-red-50"
            },
            "ESFP": {
                name: "表演者",
                description: "自发的、精力充沛的表演者，生活从不无聊在他们身边。你热爱成为焦点，喜欢给他人带来快乐。",
                strengths: ["大胆", "原创", "乐观", "实用", "善于观察"],
                weaknesses: ["敏感", "避免冲突", "容易无聊", "难以集中", "不善规划"],
                careers: ["活动策划", "销售", "演员", "健身教练", "导游"],
                color: "from-fuchsia-500 to-pink-500",
                bgColor: "bg-gradient-to-br from-fuchsia-50 to-pink-50"
            }
        };
        
        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        
        function startTest() {
            currentQuestion = 0;
            answers = new Array(questions.length).fill(null);
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('test-view').classList.remove('hidden');
            document.getElementById('result-view').classList.add('hidden');
            
            renderQuestion();
        }
        
        function renderQuestion() {
            const question = questions[currentQuestion];
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            
            document.getElementById('progress-text').textContent = `问题 ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-percent').textContent = `${Math.round(progress)}%`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-tag').textContent = `第 ${currentQuestion + 1} 题`;
            document.getElementById('question-text').textContent = question.text;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full p-6 rounded-2xl text-left text-lg font-medium border-2 transition-all ${
                    answers[currentQuestion] === index 
                        ? 'selected border-purple-500 bg-purple-50 text-purple-700' 
                        : 'border-gray-200 bg-white text-gray-700 hover:border-purple-300 hover:bg-purple-50/50'
                }`;
                btn.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="w-10 h-10 rounded-full ${answers[currentQuestion] === index ? 'bg-purple-500 text-white' : 'bg-gray-100 text-gray-500'} flex items-center justify-center font-bold">
                            ${answers[currentQuestion] === index ? '✓' : String.fromCharCode(65 + index)}
                        </span>
                        <span>${option.text}</span>
                    </div>
                `;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });
            
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            prevBtn.disabled = currentQuestion === 0;
            
            if (answers[currentQuestion] !== null) {
                nextBtn.disabled = false;
                nextBtn.textContent = currentQuestion === questions.length - 1 ? '查看结果 ✨' : '下一题 →';
            } else {
                nextBtn.disabled = true;
                nextBtn.textContent = '下一题 →';
            }
        }
        
        function selectOption(index) {
            answers[currentQuestion] = index;
            renderQuestion();
        }
        
        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                calculateResult();
            }
        }
        
        function calculateResult() {
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            
            questions.forEach((question, index) => {
                const answer = answers[index];
                if (answer !== null) {
                    const option = question.options[answer];
                    const dimension = option.dimension;
                    const value = option.value;
                    
                    if (dimension === 'EI') {
                        if (value > 0) scores.E++;
                        else scores.I++;
                    } else if (dimension === 'SN') {
                        if (value > 0) scores.S++;
                        else scores.N++;
                    } else if (dimension === 'TF') {
                        if (value > 0) scores.T++;
                        else scores.F++;
                    } else if (dimension === 'JP') {
                        if (value > 0) scores.J++;
                        else scores.P++;
                    }
                }
            });
            
            const resultType = 
                (scores.E >= scores.I ? 'E' : 'I') +
                (scores.S >= scores.N ? 'S' : 'N') +
                (scores.T >= scores.F ? 'T' : 'F') +
                (scores.J >= scores.P ? 'J' : 'P');
            
            showResult(resultType);
        }
        
        function showResult(type) {
            const typeData = mbtiTypes[type];
            
            document.getElementById('test-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            
            const resultContainer = document.getElementById('result-container');
            resultContainer.className = `min-h-screen ${typeData.bgColor}`;
            
            resultContainer.innerHTML = `
                <div class="container mx-auto px-6 py-12">
                    <div class="max-w-4xl mx-auto">
                        <div class="text-center mb-12 bounce-in">
                            <div class="inline-block px-6 py-2 bg-white/80 backdrop-blur rounded-full text-gray-600 mb-6">
                                🎉 测试完成！
                            </div>
                            <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">你是</h1>
                            <div class="text-7xl md:text-9xl font-extrabold bg-gradient-to-r ${typeData.color} bg-clip-text text-transparent">
                                ${type}
                            </div>
                            <p class="text-2xl md:text-3xl font-semibold text-gray-700 mt-4">${typeData.name}</p>
                        </div>
                        
                        <div class="glass-card rounded-3xl p-8 md:p-10 shadow-xl mb-8 fade-up" style="animation-delay: 0.2s;">
                            <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-3">
                                <span class="text-3xl">📖</span>
                                性格解析
                            </h2>
                            <p class="text-lg text-gray-600 leading-relaxed">
                                ${typeData.description}
                            </p>
                        </div>
                        
                        <div class="grid md:grid-cols-2 gap-6 mb-8">
                            <div class="glass-card rounded-3xl p-8 shadow-xl fade-up" style="animation-delay: 0.4s;">
                                <h3 class="text-xl font-bold text-gray-800 mb-5 flex items-center gap-3">
                                    <span class="text-2xl">💪</span>
                                    你的优势
                                </h3>
                                <ul class="space-y-3">
                                    ${typeData.strengths.map(s => `<li class="strength-item text-gray-700 text-lg">${s}</li>`).join('')}
                                </ul>
                            </div>
                            
                            <div class="glass-card rounded-3xl p-8 shadow-xl fade-up" style="animation-delay: 0.6s;">
                                <h3 class="text-xl font-bold text-gray-800 mb-5 flex items-center gap-3">
                                    <span class="text-2xl">🌱</span>
                                    成长空间
                                </h3>
                                <ul class="space-y-3">
                                    ${typeData.weaknesses.map(w => `<li class="weakness-item text-gray-700 text-lg">${w}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                        
                        <div class="glass-card rounded-3xl p-8 shadow-xl mb-10 fade-up" style="animation-delay: 0.8s;">
                            <h3 class="text-xl font-bold text-gray-800 mb-5 flex items-center gap-3">
                                <span class="text-2xl">💼</span>
                                适合职业
                            </h3>
                            <div class="flex flex-wrap gap-3">
                                ${typeData.careers.map(c => `
                                    <span class="px-5 py-2 bg-gradient-to-r ${typeData.color} text-white rounded-full font-medium">
                                        ${c}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="flex flex-col sm:flex-row gap-4 justify-center fade-up" style="animation-delay: 1s;">
                            <button onclick="restartTest()" class="primary-btn text-white text-lg font-semibold px-10 py-4 rounded-full">
                                🔄 重新测试
                            </button>
                            <button onclick="shareResult('${type}')" class="px-10 py-4 bg-white text-gray-700 text-lg font-semibold rounded-full border-2 border-gray-200 hover:border-purple-300 transition-all">
                                📤 分享结果
                            </button>
                        </div>
                        
                        <div class="mt-12 text-center fade-up" style="animation-delay: 1.2s;">
                            <p class="text-gray-500 mb-6">想了解其他性格类型？</p>
                            <div class="grid grid-cols-4 sm:grid-cols-8 gap-2 max-w-2xl mx-auto">
                                ${Object.keys(mbtiTypes).map(t => `
                                    <button onclick="showTypeInfo('${t}')" class="type-card px-3 py-2 rounded-xl font-bold ${t === type ? `bg-gradient-to-r ${typeData.color} text-white` : 'bg-white text-gray-600 hover:bg-gray-100'} border border-gray-200">
                                        ${t}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function showTypeInfo(type) {
            calculateResult();
            showResult(type);
        }
        
        function shareResult(type) {
            const text = `我刚做了 MBTI 性格测试，结果是 ${type} - ${mbtiTypes[type].name}！快来发现你的性格类型吧 ✨`;
            
            if (navigator.share) {
                navigator.share({
                    title: '我的 MBTI 测试结果',
                    text: text,
                }).catch(err => console.log('分享失败', err));
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('结果已复制到剪贴板！');
                }).catch(() => {
                    alert('你的结果是：' + type + ' - ' + mbtiTypes[type].name);
                });
            }
        }
        
        function restartTest() {
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
